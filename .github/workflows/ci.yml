name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Software tests
        run: python -m pytest tests -q

      - name: Rule registry
        run: python scripts/rule_registry_check.py

      - name: Model capability profile
        run: python scripts/model_profile_check.py

      - name: Ability library
        run: python scripts/ability_library.py --validate

      - name: Style library
        run: python scripts/style_library.py --validate

      - name: Regression suite structure
        run: python scripts/run_regression.py --cases tests --out regression_result.json

      - name: Local markdown links
        run: |
          python - <<'PY'
          import pathlib, re, sys

          root = pathlib.Path('.')
          bad = []
          for f in root.rglob('*.md'):
              if '.git' in f.parts:
                  continue
              text = f.read_text(encoding='utf-8')
              for m in re.finditer(r'\[[^\]]*\]\(([^)\s]+)\)', text):
                  target = m.group(1)
                  if target.startswith(('http://', 'https://', '#', 'mailto:')):
                      continue
                  path = target.split('#')[0]
                  if not path:
                      continue
                  if not (f.parent / path).resolve().exists():
                      bad.append(f'{f}: {target}')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print('all local markdown links resolve')
          PY
